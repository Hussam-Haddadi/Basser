<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Basir Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>

<body data-bs-theme="dark">

<header id="brandBar"><img src="Baseer.png" alt="Basir logo"></header>

<div class="container py-4">

  <div class="row g-3" id="kpiRow"></div>

  <div class="card mt-4">
    <div class="card-header fw-semibold">Leakage Trend</div>
    <div class="card-body"><div class="chart-container"><canvas id="leakChart"></canvas></div></div>
  </div>

  <div class="card mt-4">
    <div class="card-header fw-semibold">Sensors Status</div>
    <div class="card-body">

      <div class="input-group mb-3">
        <input id="newSensorId"  class="form-control" placeholder="Sensor ID">
        <input id="newSensorLoc" class="form-control" placeholder="Zone">
        <input id="newPipeId"    class="form-control" placeholder="Pipe ID">
        <input id="newWifiSsid"  class="form-control" placeholder="Wi-Fi SSID">
        <input id="newWifiPass"  type="password" class="form-control" placeholder="Wi-Fi Password">
        <button class="btn btn-outline-secondary" id="togglePassBtn" type="button">
          <i class="bi bi-eye"></i>
        </button>
        <button id="addSensorBtn" class="btn btn-primary" type="button">Add</button>
      </div>

      <ul id="sensorList" class="list-group list-group-flush"></ul>
    </div>
  </div>

  <div class="card mt-4 mb-5">
    <div class="card-header fw-semibold">Pipes – Live Data</div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-dark align-middle mb-0" id="pipeTable">
          <thead>
            <tr>
              <th>Pipe</th><th>Sensor</th><th>Pressure</th><th>Loss Rate</th>
              <th>Avg Repair (min)</th><th>Last Leak</th><th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
